services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_PATH: /app/databases/books_database.db
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: llama3.2:1b
      EMBEDDING_MODEL: nomic-embed-text
    volumes:
      - ./databases:/app/databases
    expose:
      - "8000"
    depends_on:
      - chromadb
      - ollama
    networks:
      - backend

  
  chromadb:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data
    expose:
      - "8000"
    networks:
      - backend


  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  chroma_data:
  ollama_data:

networks:
  backend:
    driver: bridge
